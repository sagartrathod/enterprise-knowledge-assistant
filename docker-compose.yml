services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_vector_db
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5435:5432"

    volumes:
      - postgres_vector_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag_fastapi_app
    restart: always

    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    volumes:
      - /tmp/uploads:/tmp/uploads

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_vector_data: